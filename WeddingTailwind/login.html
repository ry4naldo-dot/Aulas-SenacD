<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Área de Login</title>
  </head>
  <body
    class="bg-gradient-to-r from-gray-100 to-gray-200 min-h-screen flex flex-col"
  >
    <header class="bg-cyan-700 text-white shadow-lg">
      <div class="container mx-auto px-4 flex items-center justify-center py-6">
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-wide">
          Senac Wedding
        </h1>
      </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4">
      <form
        class="bg-white shadow-2xl border p-8 rounded-3xl w-full max-w-md text-center"
      >
        <h2 class="text-2xl font-bold text-cyan-700 mb-6">Login</h2>

        <label class="mt-4 font-semibold block text-left" for="nomeLogin"
          >Nome:</label
        >
        <input
          class="w-full p-3 mt-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-cyan-700"
          type="text"
          id="nomeLogin"
          name="nomeLogin"
          required
        />

        <label class="mt-4 font-semibold block text-left" for="emailLogin"
          >E-mail:</label
        >
        <input
          class="w-full p-3 mt-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-cyan-700"
          type="email"
          id="emailLogin"
          name="emailLogin"
          required
        />

        <label class="mt-4 font-semibold block text-left" for="cpfAdmin">CPF:</label>
        <input
          class="w-full p-3 mt-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-cyan-700"
          type="text"
          id="cpfLogin"
          name="cpfLogin"
          maxlength="11"
          required
        />

        <label class="mt-4 font-semibold block text-left" for="senhaAdmin">Senha:</label>
        <input
          class="w-full p-3 mt-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-cyan-700"
          type="password"
          id="senhaAdmin"
          name="senhaAdmin"
          maxlength="16"
          required
        />

        <div class="flex flex-col gap-4 mt-8">
          <button
            class="w-full p-3 bg-red-400 text-white rounded-xl text-lg font-semibold cursor-pointer hover:bg-red-500 transition"
          >
            Entrar
          </button>

          <!-- <button class="w-full p-3 bg-cyan-700 text-white rounded-xl text-lg font-semibold cursor-pointer hover:bg-cyan-800 transition" type="button">
          Entrar como Admin
        </button> -->
        </div>
      </form>
    </main>
  </body>
</html>
